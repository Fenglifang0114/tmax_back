name: Build Go Backend for macOS

on:
  push:
    branches:
      - macOs
  workflow_dispatch:

jobs:
  build-macos-backend:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build macOS Binary (ARM64 & AMD64)
        run: |
          cd Backend
          # Build AMD64 (Intel)
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags="-X 'main.Version=v1.82'" -o tmaxsrv_amd64 main.go
          
          # Build ARM64 (Apple Silicon)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags="-X 'main.Version=v1.82'" -o tmaxsrv_arm64 main.go
          
          # Combine into Universal Binary
          lipo -create -output tmaxsrv_mac tmaxsrv_amd64 tmaxsrv_arm64
          chmod +x tmaxsrv_mac

      - name: Upload macOS Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmaxBack-macOS-Executable
          path: Backend/tmaxsrv_mac
