name: Build Go Backend for macOS

on:
  push:
    branches:
      - macOs
  workflow_dispatch:

jobs:
  build-macos-backend:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build macOS Binary (ARM64 & AMD64)
        run: |
          cd Backend
          # Build ARM64 (Apple Silicon M1/M2/M3 Mac)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CGO_CFLAGS="-arch arm64" CGO_LDFLAGS="-arch arm64" go build -ldflags="-X 'main.Version=v1.82'" -o tmaxsrv_arm64 main.go
          
          # Build AMD64 (Intel Mac)
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" go build -ldflags="-X 'main.Version=v1.82'" -o tmaxsrv_amd64 main.go || true
          
          # Create Universal or single binary
          if [ -f tmaxsrv_amd64 ]; then
            lipo -create -output tmaxsrv_mac tmaxsrv_amd64 tmaxsrv_arm64
          else
            mv tmaxsrv_arm64 tmaxsrv_mac
          fi
          chmod +x tmaxsrv_mac

      - name: Upload macOS Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmaxBack-macOS-Executable
          path: Backend/tmaxsrv_mac
